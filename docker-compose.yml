services:
  db:
    image: postgres:16-alpine
    container_name: bpr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bpr_ams}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bpr_ams}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bpr_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bpr_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
    ports:
      - "${HOST_PORT:-3001}:3000"
    volumes:
      - ./output:/app/output
      - ./public:/app/public
    networks:
      - bpr_network

volumes:
  postgres_data:

networks:
  bpr_network:
    driver: bridge
